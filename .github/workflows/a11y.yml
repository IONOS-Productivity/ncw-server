# DRAFT / proof of concept: accessibility checks (axe-core + Playwright) for the IONOS theming customisations.
# Starts as non-blocking (A11Y_REPORT_ONLY) until the findings of the first run are triaged.
name: A11y (IONOS theme)

on:
  pull_request:
    paths:
      - 'apps/theming/css/ionos/**'
      - 'apps/theming/lib/Themes/IonosTheme.php'
      - 'apps/theming/src/ionos.js'
      - 'a11y/**'
      - '.github/workflows/a11y.yml'
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 3rdparty is needed to boot the server. Other submodules (private IONOS apps) are not needed
          # for the theme checks; add a deploy key here once pages of those apps should be covered.
          submodules: false

      - name: Checkout 3rdparty
        run: git submodule update --init --depth 1 3rdparty

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, gd, intl, mbstring, zip, curl, xml, gmp, bcmath
          coverage: none

      - name: Install Nextcloud (sqlite) with the IONOS theme enforced
        run: |
          php occ maintenance:install --database=sqlite --admin-user=admin --admin-pass=admin123 --no-interaction
          php occ config:system:set trusted_domains 1 --value=localhost:8080
          php occ config:system:set enforce_theme --value=ionos

      - name: Start PHP server
        run: |
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8080 -t . a11y/scripts/router.php > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/login > /dev/null && break; sleep 1; done
          curl -s -o /dev/null -w 'login=%{http_code}\n' http://localhost:8080/login
          curl -s -o /dev/null -w 'dav=%{http_code} (401 is expected without login)\n' http://localhost:8080/remote.php/dav/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: a11y/package-lock.json

      - name: Install a11y dependencies
        working-directory: a11y
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run axe + Playwright
        working-directory: a11y
        env:
          # drop this line to make findings fail the build
          A11Y_REPORT_ONLY: '1'
        run: npx playwright test

      - name: Summary
        if: ${{ !cancelled() }}
        working-directory: a11y
        run: |
          npm run --silent summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            a11y/playwright-report/
            a11y/a11y-results/
          retention-days: 30
